01-overview.png:
  en: "The board matrixMAX is bought for: the matrix condenses host and service health into a colour-coded grid, and the cell you select opens its exact problem in the matrixMAX-detail companion beside it."
  cs: "Nástěnka, kvůli které se matrixMAX kupuje: matice zhušťuje stav hostů a služeb do barevné mřížky a vybraná buňka otevře svůj přesný problém v doprovodném widgetu matrixMAX-detail vedle ní."
02-matrix.png:
  en: "Hosts down the side, trigger tags across the top; every cell carries the highest open severity in Zabbix's own colours, a blank cell means the host has no check behind that column, and a wrench marks a host in maintenance."
  cs: "Hosté po straně, tagy triggerů nahoře; každá buňka nese nejvyšší otevřenou závažnost v barvách Zabbixu, prázdná buňka znamená, že host za daným sloupcem žádnou kontrolu nemá, a klíč označuje hosta v údržbě."
03-groups.png:
  en: "Rows by host groups: hosts fold into their groups and each cell shows the worst problem found on any host of the group behind that column."
  cs: "Řádky podle skupin hostů: hosty se složí do svých skupin a každá buňka ukazuje nejhorší problém nalezený na kterémkoli hostovi skupiny za daným sloupcem."
cell-detail.png:
  en: "The matrixMAX-detail companion: the host, the trigger and its problem, event details and actions behind the clicked cell."
  cs: "Doprovodný widget matrixMAX-detail: host, trigger a jeho problém, detaily události a akce za kliknutou buňkou."
dark-theme.png:
  en: "The same board on a dark theme - severity cells, the detail card and its controls stay readable."
  cs: "Stejná nástěnka v tmavém motivu - buňky závažnosti, karta detailu i její ovládání zůstávají čitelné."
06-settings.png:
  en: "The complete matrix configuration: Hosts / Host groups / Services, tag discovery, ordering, suppressed problems, problems-only delivery and optional hover previews."
  cs: "Celá konfigurace matice: hosté, skupiny nebo služby, načítání tagů, řazení, potlačené problémy, předávání pouze problémů do detailu a volitelné náhledy při najetí."
detail-settings.png:
  en: "Detail configuration: receive from all matrices, select None / Host / Problem / All native scripts, control configuration buttons and arrange compact inventory fields."
  cs: "Konfigurace detailu: příjem ze všech matic, nativní skripty None / Host / Problem / All, zobrazení tlačítek konfigurace a kompaktní řazení polí inventáře."
cell-detail-popup-6x.png:
  en: "On Zabbix 6.4 - and anywhere no companion tile is placed - the same cell detail opens as a dialog instead."
  cs: "Na Zabbixu 6.4 - a všude, kde není umístěna doprovodná dlaždice - se týž detail buňky otevře jako dialog."
