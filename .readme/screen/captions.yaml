01-overview.png:
  en: "The matrix condenses host and service health into a color-coded overview; selecting a cell opens the exact problem context."
  cs: "Matice zhušťuje stav hostů a služeb do barevného přehledu; výběr buňky otevře přesný kontext problému."
02-matrix.png:
  en: "Hosts down the side, service tags across the top; every cell carries the highest open severity in Zabbix's own colours."
  cs: "Hosty dole po straně, tagy služeb nahoře; každá buňka nese nejvyšší otevřenou závažnost v barvách Zabbixu."
06-settings.png:
  en: "The widget form: host groups, service tags, host order and the severity filter."
  cs: "Formulář widgetu: skupiny hostů, tagy služeb, pořadí hostů a filtr závažnosti."
